<body>
<header><h1>峠のチーズタルト｜イベント販売管理</h1><div class="sub" id="head"></div></header>
<div id="cloudbar" class="cloudbar">☁ クラウド同期を準備しています…</div><nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
/*
  タルト販売管理 v9.2（現金お釣り計算追加）
  - Firebaseの既存保存先・既存KEYを維持
  - iPhone/PC/Androidの同期方式を変更しない
  - 在庫の物理フローを明確化
    初回搬入 → ショーケース
    追加搬入 → ストッカー
    ストッカー → ショーケース（明示的に移動）
    販売 → ショーケースから減少
  - 総在庫 = ショーケース + ストッカー
  - 総在庫 = 初回搬入 + 追加搬入 - 販売数
*/

const KEY="toge_tart_manager_final_v2";
const base=[
  ["plain","プレーン",400],["double","Wチーズ",400],["choco","チョコレート",400],
  ["has","ハスカップ",400],["sea","シーベリー",400],["blue","ブルーベリー",400],
  ["white","白いガトーショコラ",450]
];

let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
  events:[],
  products:base.map(x=>({id:x[0],name:x[1],price:x[2]})),
  staff:["スタッフ1","スタッフ2"],
  payments:["現金","PayPay"],
  tab:"events"
};

function normalizeDb(){
  if(!db || typeof db!=="object") db={};
  db.events=Array.isArray(db.events)?db.events:[];
  db.products=Array.isArray(db.products)&&db.products.length?db.products:base.map(x=>({id:x[0],name:x[1],price:x[2]}));
  db.staff=Array.isArray(db.staff)?db.staff:["スタッフ1","スタッフ2"];
  db.payments=Array.isArray(db.payments)&&db.payments.length?db.payments:["現金","PayPay"];
  db.tab=db.tab||"events";
  db.events.forEach(ev=>{
    if(!ev || typeof ev!=="object") return;
    ev.transactions=Array.isArray(ev.transactions)?ev.transactions:[];
    ev.cart=Array.isArray(ev.cart)?ev.cart:[];
    ev.stock=Array.isArray(ev.stock)?ev.stock:[];
    ev.stockMoves=Array.isArray(ev.stockMoves)?ev.stockMoves:[];
    ev.undoStack=Array.isArray(ev.undoStack)?ev.undoStack:[];
    ev.prices=ev.prices&&typeof ev.prices==="object"?ev.prices:{};
    ev.closed=ev.closed&&typeof ev.closed==="object"?ev.closed:{};
    ev.fees=ev.fees&&typeof ev.fees==="object"?ev.fees:{};
    ev.staffByDay=ev.staffByDay&&typeof ev.staffByDay==="object"?ev.staffByDay:{};
    ev.dayNotes=ev.dayNotes&&typeof ev.dayNotes==="object"?ev.dayNotes:{};
    ev.addByDay=ev.addByDay&&typeof ev.addByDay==="object"?ev.addByDay:{};
    ev.dayArchives=ev.dayArchives&&typeof ev.dayArchives==="object"?ev.dayArchives:{};
    ev.manualDays=ev.manualDays&&typeof ev.manualDays==="object"?ev.manualDays:{};
    ev.takeBackByDay=ev.takeBackByDay&&typeof ev.takeBackByDay==="object"?ev.takeBackByDay:{};
    ev.wasteByDay=ev.wasteByDay&&typeof ev.wasteByDay==="object"?ev.wasteByDay:{};
    ev.resetUndoStack=Array.isArray(ev.resetUndoStack)?ev.resetUndoStack:[];
    ev.eventClosed=!!ev.eventClosed;
    ev.closedAt=ev.closedAt||null;
  });
}
normalizeDb();

let cloudUser=null, cloudReady=false, cloudRef=null, cloudApplying=false;
const localSave=()=>localStorage.setItem(KEY,JSON.stringify(db));
const save=()=>{
  localSave();
  if(cloudReady&&cloudRef&&!cloudApplying){
    clearTimeout(window.__cloudSaveTimer);
    window.__cloudSaveTimer=setTimeout(
      ()=>cloudRef.set(db).catch(err=>setCloudStatus("⚠ 同期エラー："+(err?.message||err),"clouderr")),120
    );
  }
};
function setCloudStatus(msg,cls=""){
  const el=document.getElementById("cloudbar");
  if(el) el.innerHTML=`<b class="${cls}">${msg}</b>`;
}
function cloudLoginView(){
  return `<div class="card loginbox"><h2>☁ 会計データをクラウド同期</h2>
  <p class="muted">PC・iPhone・Androidで同じ会計データを使うには、同じメールアドレスでログインしてください。</p>
  <label>メールアドレス</label><input id="cloudEmail" type="email" autocomplete="username" placeholder="例：xxxx@example.com">
  <label>パスワード</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="6文字以上">
  <div class="row" style="margin-top:10px"><button class="primary" style="flex:1" onclick="cloudSignIn()">ログイン</button>
  <button class="soft" style="flex:1" onclick="cloudSignUp()">新規登録</button></div>
  <p class="muted" style="margin-bottom:0">※このアプリ用のアカウントです。Google等の外部サービスのパスワードを入力する必要はありません。</p></div>`;
}
function cloudSetupView(){
  return `<div class="card loginbox"><h2>☁ クラウド設定が未完了です</h2>
  <p>Firebaseの設定がまだ入っていません。</p>
  <div class="notice">この段階では現在の端末のデータは消えません。</div></div>`;
}
async function cloudSignIn(){
  const email=document.getElementById("cloudEmail")?.value.trim(),pw=document.getElementById("cloudPassword")?.value||"";
  if(!email||!pw)return alert("メールアドレスとパスワードを入力してください。");
  try{await firebase.auth().signInWithEmailAndPassword(email,pw)}
  catch(err){alert("ログインできませんでした。\n"+(err?.message||err))}
}
async function cloudSignUp(){
  const email=document.getElementById("cloudEmail")?.value.trim(),pw=document.getElementById("cloudPassword")?.value||"";
  if(!email||!pw)return alert("メールアドレスとパスワードを入力してください。");
  if(pw.length<6)return alert("パスワードは6文字以上にしてください。");
  try{await firebase.auth().createUserWithEmailAndPassword(email,pw);alert("アカウントを作成しました。")}
  catch(err){alert("新規登録できませんでした。\n"+(err?.message||err))}
}
async function cloudLogout(){await firebase.auth().signOut()}

function cloudInit(){
  const cfg=window.TART_FIREBASE_CONFIG||{};
  if(!cfg.apiKey||!cfg.projectId||!cfg.databaseURL){
    setCloudStatus("⚠ クラウド設定待ち","cloudwarn");
    document.getElementById("app").innerHTML=cloudSetupView(); return;
  }
  try{
    firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(user=>{
      cloudUser=user||null; cloudReady=false; cloudRef=null;
      if(!user){
        setCloudStatus("☁ 未ログイン");
        document.getElementById("app").innerHTML=cloudLoginView(); return;
      }
      cloudRef=firebase.database().ref("users/"+user.uid+"/app");
      setCloudStatus("☁ クラウド同期中…");
      cloudRef.once("value").then(snap=>{
        const remote=snap.val();
        let groupChanged=false;
        if(remote){
          db={
            ...db,...remote,
            events:Array.isArray(remote.events)?remote.events:db.events,
            products:Array.isArray(remote.products)?remote.products:db.products,
            staff:Array.isArray(remote.staff)?remote.staff:db.staff,
            payments:Array.isArray(remote.payments)?remote.payments:db.payments
          };
          normalizeDb();
          groupChanged=normalizeAllGroupNumbers();
        }
        localSave();
        cloudReady=true;
        if(groupChanged) save();
        setCloudStatus("☁ 同期中："+user.email,"cloudok");
        render();
        if(!remote) cloudRef.set(db).catch(err=>setCloudStatus("⚠ 初回保存エラー："+(err?.message||err),"clouderr"));
        cloudRef.on("value",snap2=>{
          if(!cloudReady||cloudApplying)return;
          const v=snap2.val(); if(!v)return;
          cloudApplying=true;
          db=v; normalizeDb();
          const groupChanged=normalizeAllGroupNumbers();
          localSave();
          render();
          cloudApplying=false;
          if(groupChanged) save();
          setCloudStatus("☁ 同期中："+user.email,"cloudok");
        });
      }).catch(err=>{
        setCloudStatus("⚠ クラウド接続エラー："+(err?.message||err),"clouderr");
        document.getElementById("app").innerHTML=cloudLoginView();
      });
    });
  }catch(err){
    setCloudStatus("⚠ Firebase初期化エラー："+(err?.message||err),"clouderr");
    document.getElementById("app").innerHTML=cloudSetupView();
  }
}

const CLEAR_MARK="toge_tart_manager_clear_accounts_20260902";
const STOCK_V2_MARK="toge_tart_manager_stock_v2_20260907";
const V3_MARK="toge_tart_manager_stock_v3_20260912";

/* 旧v2の在庫を壊さず、現在の「初回+追加-販売」と一致する形へ一度だけ整える。
   既存のshow/storeの比率をできるだけ維持し、販売数だけを反映する。 */
function migrateStockV3(){
  if(localStorage.getItem(V3_MARK)) return;
  (db.events||[]).forEach(ev=>{
    ev.stock=ev.stock||[];
    ev.stockMoves=Array.isArray(ev.stockMoves)?ev.stockMoves:[];
    const soldBy={};
    (ev.transactions||[]).filter(t=>t.status!=="void").forEach(t=>{
      (t.items||[]).forEach(i=>soldBy[i.productId]=(soldBy[i.productId]||0)+Number(i.qty||0));
    });
    ev.stock.forEach(s=>{
      const total=Math.max(0,Number(s.in||0)+Number(s.add||0)-(soldBy[s.productId]||0));
      const oldShow=Math.max(0,Number(s.show||0));
      const oldStore=Math.max(0,Number(s.store||0));
      const oldTotal=oldShow+oldStore;
      if(oldTotal===total){
        s.show=oldShow; s.store=oldStore;
      }else{
        s.show=Math.min(total,Math.max(0,oldShow));
        s.store=total-s.show;
      }
    });
  });
  localSave();
  localStorage.setItem(V3_MARK,"1");
}
migrateStockV3();

/* 旧版で一度だけ会計データを初期化した仕組みはそのまま維持。
   すでに実行済み端末では何も起きない。 */
if(!localStorage.getItem(CLEAR_MARK)){
  (db.events||[]).forEach(ev=>{ev.transactions=[];ev.cart=[];ev.closed={};ev.editTxId=null;ev.fees={};});
  save(); localStorage.setItem(CLEAR_MARK,"1");
}

function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1400);
}
function flash(el,msg){
  if(el){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}
  if(msg)toast(msg);
}
const e=()=>db.events.find(x=>x.id===location.hash.slice(1))||db.events[0];
const yen=n=>"¥"+Math.round(n||0).toLocaleString();
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num=v=>Math.max(0,Math.floor(Number(v)||0));
const clone=v=>JSON.parse(JSON.stringify(v));
function liveDayData(x,d){
  const tx=transactions(x,d), pm=payTotals(x,d), fee=x.feeMode==="daily"?Number(x.fees?.[d]||0):0;
  const products=db.products.map(p=>{
    const items=tx.flatMap(t=>t.items||[]).filter(i=>i.productId===p.id);
    return {id:p.id,name:p.name,qty:items.reduce((a,i)=>a+num(i.qty),0),sales:items.reduce((a,i)=>a+num(i.qty)*Number(i.price||0),0)};
  });
  const slotData={};
  const [a,b]=x.open.split(":").map(Number),[c,f]=x.close.split(":").map(Number);
  const start=a*60+b,end=c*60+f,step=(x.slot||1)*60;
  for(let m=start;m<end;m+=step){
    const z=Math.min(m+step,end),arr=tx.filter(t=>{const q=new Date(t.timestamp),v=q.getHours()*60+q.getMinutes();return v>=m&&v<z;});
    const key=fmt(m)+" ～ "+fmt(z);
    slotData[key]={qty:arr.reduce((a,t)=>a+(t.items||[]).reduce((b,i)=>b+num(i.qty),0),0),sales:arr.reduce((a,t)=>a+Number(t.total||0),0),groups:arr.length};
  }
  return {source:"live",day:d,sales:tx.reduce((a,t)=>a+Number(t.total||0),0),qty:tx.reduce((a,t)=>a+(t.items||[]).reduce((b,i)=>b+num(i.qty),0),0),groups:tx.length,staff:staffForDay(x,d),fee,pm,products,slotData,inventory:clone(stockMap(x)),takeBack:clone(x.takeBackByDay?.[d]||{}),waste:clone(x.wasteByDay?.[d]||{})};
}
function archiveDay(x,d){
  const r=liveDayData(x,d);
  r.source="closed";r.closedAt=x.closed?.[d]||new Date().toISOString();
  x.dayArchives=x.dayArchives||{};x.dayArchives[d]=clone(r);
  return r;
}
function dayData(x,d){
  // 手入力実績は通常の会計履歴とは完全に分離しつつ、
  // イベント集計では「1日分の実績」として必ず集計する。
  if(x?.manualDays?.[d]) return manualDayData(x,d);
  if(x?.dayArchives?.[d]) return {...clone(x.dayArchives[d]),source:"closed",day:d};
  return liveDayData(x,d);
}
function resetSnapshot(x,label){
  return {label,timestamp:new Date().toISOString(),transactions:clone(x.transactions||[]),cart:clone(x.cart||[]),stock:clone(x.stock||[]),stockMoves:clone(x.stockMoves||[]),fees:clone(x.fees||{}),closed:clone(x.closed||{}),staffByDay:clone(x.staffByDay||{}),dayNotes:clone(x.dayNotes||{}),addByDay:clone(x.addByDay||{}),dayArchives:clone(x.dayArchives||{}),manualDays:clone(x.manualDays||{}),takeBackByDay:clone(x.takeBackByDay||{}),wasteByDay:clone(x.wasteByDay||{}),eventClosed:!!x.eventClosed,closedAt:x.closedAt||null,dayArchives:clone(x.dayArchives||{}),manualDays:clone(x.manualDays||{}),takeBackByDay:clone(x.takeBackByDay||{}),wasteByDay:clone(x.wasteByDay||{})};
}
function pushResetUndo(x,label){
  x.resetUndoStack=Array.isArray(x.resetUndoStack)?x.resetUndoStack:[];
  x.resetUndoStack.push(resetSnapshot(x,label));
  if(x.resetUndoStack.length>5)x.resetUndoStack.shift();
}
function undoReset(){
  const x=e();if(!x)return;
  const u=x.resetUndoStack?.pop();if(!u)return alert("初期化を戻せる記録がありません。");
  Object.assign(x,{transactions:clone(u.transactions||[]),cart:clone(u.cart||[]),stock:clone(u.stock||[]),stockMoves:clone(u.stockMoves||[]),fees:clone(u.fees||{}),closed:clone(u.closed||{}),staffByDay:clone(u.staffByDay||{}),dayNotes:clone(u.dayNotes||{}),addByDay:clone(u.addByDay||{}),dayArchives:clone(u.dayArchives||{}),manualDays:clone(u.manualDays||{}),takeBackByDay:clone(u.takeBackByDay||{}),wasteByDay:clone(u.wasteByDay||{}),eventClosed:!!u.eventClosed,closedAt:u.closedAt||null,editTxId:null});
  save();render();toast("初期化前の状態に戻しました");
}
function recordLoss(x,d,pid,n,type){
  const s=ensureStock(x,pid),total=num(s.show)+num(s.store);n=num(n);
  if(n<1)return false;if(n>total)return false;
  const fromShow=Math.min(num(s.show),n);s.show-=fromShow;s.store-=n-fromShow;

/* 会計番号：日ごとに1組目から開始する。
   既存データも日付ごとに並べ直し、前日の番号を翌日に持ち越さない。 */
function normalizeGroupNumbersByDay(ev){
  if(!ev)return false;
  ev.transactions=Array.isArray(ev.transactions)?ev.transactions:[];
  let changed=false;
  const counters={};
  ev.transactions.slice().sort((a,b)=>{
    const da=String(a.day||'');
    const db=String(b.day||'');
    return da.localeCompare(db)||(Number(a.timestamp?new Date(a.timestamp).getTime():a.id)||0)-(Number(b.timestamp?new Date(b.timestamp).getTime():b.id)||0);
  }).forEach(t=>{
    const d=String(t.day||'');
    counters[d]=(counters[d]||0)+1;
    if(Number(t.groupNo)!==counters[d]){t.groupNo=counters[d];changed=true;}
  });
  ev.cart=ev.cart||[];
  return changed;
}
function normalizeAllGroupNumbers(){
  let changed=false;
  (db.events||[]).forEach(ev=>{if(normalizeGroupNumbersByDay(ev))changed=true;});
  return changed;
}
normalizeAllGroupNumbers();

function jpToday(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function dayList(x){
  const a=[];
  // UTCベースで日付文字列を扱い、端末のタイムゾーンによる1日ズレを防止
  let d=new Date(x.start+"T00:00:00+09:00"), z=new Date(x.end+"T00:00:00+09:00");
  while(d<=z){
    a.push(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(d));
    d=new Date(d.getTime()+86400000);
  }
  return a;
}
function selectedDay(x){
  const t=jpToday(),days=dayList(x);
  return x.selectedDay&&days.includes(x.selectedDay)?x.selectedDay:(days.includes(t)?t:days[0]);
}
function transactions(x,day=null){return (x?.transactions||[]).filter(t=>t.status!=="void"&&(!day||t.day===day))}
function allTransactions(x,day=null){return (x?.transactions||[]).filter(t=>!day||t.day===day)}
function nextGroupNo(x,d){
  // 会計番号は必ず「その日の会計」だけを基準にする。前日の番号は一切参照しない。
  const nums=(x.transactions||[])
    .filter(t=>t.day===d && t.status!=="void")
    .map(t=>Number(t.groupNo)||0);
  return Math.max(0,...nums)+1;
}
function sales(x,day=null){return transactions(x,day).reduce((s,t)=>s+Number(t.total||0),0)}
function qty(x,pid,day=null){
  return transactions(x,day).reduce((s,t)=>s+(t.items||[]).filter(i=>i.productId===pid).reduce((a,i)=>a+num(i.qty),0),0);
}

/* 在庫の基本状態 */
function stockMap(x){
  const m={};
  db.products.forEach(p=>m[p.id]={in:0,add:0,show:0,store:0});
  (x?.stock||[]).forEach(s=>{
    if(m[s.productId]){
      m[s.productId].in=num(s.in);m[s.productId].add=num(s.add);
      m[s.productId].show=num(s.show);m[s.productId].store=num(s.store);
    }
  });
  db.products.forEach(p=>{
    const sold=qty(x,p.id);
    m[p.id].sold=sold;
    m[p.id].remaining=m[p.id].show+m[p.id].store;
    m[p.id].totalIn=m[p.id].in+m[p.id].add;
  });
  return m;
}
function ensureStock(x,pid){
  x.stock=x.stock||[];
  let s=x.stock.find(q=>q.productId===pid);
  if(!s){
    s={productId:pid,in:0,add:0,show:0,store:0};
    x.stock.push(s);
  }
  return s;
}
function stockTotals(x,pid){
  const s=stockMap(x)[pid]||{show:0,store:0,in:0,add:0};
  return {show:s.show,store:s.store,total:s.show+s.store};
}
function changeShow(x,pid,delta){
  const s=ensureStock(x,pid),n=num(s.show)+delta;
  if(n<0)return false;
  s.show=n;return true;
}

/* 販売時は必ずショーケースから減らす */
function consumeForSale(x,items){
  const m=stockMap(x);
  for(const i of items){
    const total=(m[i.productId]?.show||0)+(m[i.productId]?.store||0);
    if(total<num(i.qty)){
      const p=db.products.find(q=>q.id===i.productId);
      return {ok:false,name:p?.name||i.name,available:total,need:num(i.qty)};
    }
  }
  for(const i of items){
    const s=ensureStock(x,i.productId),n=num(i.qty);
    const fromShow=Math.min(num(s.show),n);
    s.show-=fromShow;
    const remain=n-fromShow;
    if(remain>0)s.store-=remain;
  }
  return {ok:true};
}
function returnToShowcase(x,items){
  for(const i of items)ensureStock(x,i.productId).show+=num(i.qty);
}

/* 操作を1手順戻せるよう、イベント単位で直前状態を最大20件保存。
   Firebaseへ一緒に保存するため、PCとiPhoneの間でもUndo状態を共有する。 */
function pushUndo(x,label){
  x.undoStack=Array.isArray(x.undoStack)?x.undoStack:[];
  const snap={label,timestamp:new Date().toISOString(),stock:JSON.parse(JSON.stringify(x.stock||[])),stockMoves:JSON.parse(JSON.stringify(x.stockMoves||[])),transactions:JSON.parse(JSON.stringify(x.transactions||[])),cart:JSON.parse(JSON.stringify(x.cart||[])),fees:JSON.parse(JSON.stringify(x.fees||{})),closed:JSON.parse(JSON.stringify(x.closed||{})),staffByDay:JSON.parse(JSON.stringify(x.staffByDay||{})),dayNotes:JSON.parse(JSON.stringify(x.dayNotes||{})),addByDay:JSON.parse(JSON.stringify(x.addByDay||{})),eventClosed:!!x.eventClosed,closedAt:x.closedAt||null};
  x.undoStack.push(snap);
  if(x.undoStack.length>20)x.undoStack.shift();
}
function undoLastStep(){
  const x=e(); if(!x)return;
  if(x.eventClosed)return alert("締め済みイベントは元に戻せません。バックアップからの復元を利用してください。");
  x.undoStack=Array.isArray(x.undoStack)?x.undoStack:[];
  const u=x.undoStack.pop();
  if(!u)return alert("戻せる操作がありません。");
  x.stock=JSON.parse(JSON.stringify(u.stock||[]));
  x.stockMoves=JSON.parse(JSON.stringify(u.stockMoves||[]));
  x.transactions=JSON.parse(JSON.stringify(u.transactions||[]));
  x.cart=JSON.parse(JSON.stringify(u.cart||[]));
  x.fees=JSON.parse(JSON.stringify(u.fees||{}));
  x.closed=JSON.parse(JSON.stringify(u.closed||{}));
  x.staffByDay=JSON.parse(JSON.stringify(u.staffByDay||{}));
  x.dayNotes=JSON.parse(JSON.stringify(u.dayNotes||{}));
  x.addByDay=JSON.parse(JSON.stringify(u.addByDay||{}));
  x.dayArchives=JSON.parse(JSON.stringify(u.dayArchives||{}));x.manualDays=JSON.parse(JSON.stringify(u.manualDays||{}));x.takeBackByDay=JSON.parse(JSON.stringify(u.takeBackByDay||{}));x.wasteByDay=JSON.parse(JSON.stringify(u.wasteByDay||{}));
  x.eventClosed=!!u.eventClosed;
  x.closedAt=u.closedAt||null;
  x.editTxId=null;
  save(); render(); toast("1手順前に戻しました："+(u.label||"直前の操作"));
}
function undoButton(){
  const x=e(),n=x?.undoStack?.length||0;
  return `<button class="warn" ${n&&!x?.eventClosed?'':'disabled'} onclick="undoLastStep()">↩ 1手順前に戻す${n?`（残り${n}）`:''}</button>`;
}

function saveTx(id){
  const x=e(),t=x.transactions.find(q=>String(q.id)===String(id));if(!t)return;
  if(x.eventClosed)return alert("このイベントは締め済みです。");
  if(x.closed?.[t.day])return alert("締め済みの日は変更できません。");
  const oldItems=(t.items||[]).map(i=>({...i}));
  const items=[];
  db.products.forEach(p=>{
    const q=Math.max(0,Number(document.getElementById('txq_'+p.id)?.value)||0);
    if(q){
      const old=t.items.find(i=>i.productId===p.id);
      const price=old?.price??Number(x.prices?.[p.id]??p.price);
      items.push({productId:p.id,name:p.name,price,qty:q});
    }
  });
  if(!items.length)return alert("商品を1つ以上選択してください。");

  // 差分を計算し、増加分はショーケースから、減少分はショーケースへ戻す
  const oldBy={},newBy={};
  oldItems.forEach(i=>oldBy[i.productId]=(oldBy[i.productId]||0)+num(i.qty));
  items.forEach(i=>newBy[i.productId]=(newBy[i.productId]||0)+num(i.qty));
  const m=stockMap(x);
  for(const p of db.products){
    const diff=(newBy[p.id]||0)-(oldBy[p.id]||0);
    if(diff>0 && ((m[p.id]?.show||0)+(m[p.id]?.store||0))<diff)
      return alert(`${p.name}の在庫が不足しています。\n現在：${(m[p.id]?.show||0)+(m[p.id]?.store||0)}個`);
  }
  pushUndo(x,`${Number(t.groupNo)||'?'}組目の会計を編集`);
  for(const p of db.products){
    const diff=(newBy[p.id]||0)-(oldBy[p.id]||0);
    if(diff>0){
      const s=ensureStock(x,p.id);
      const fromShow=Math.min(num(s.show),diff);
      s.show-=fromShow;
      s.store-=diff-fromShow;
    }
    if(diff<0)ensureStock(x,p.id).show+=(-diff);
  }
  const oldTotal=t.total;
  t.items=items;t.total=items.reduce((s,i)=>s+i.qty*i.price,0);
  t.payment=document.getElementById('txpay').value;
  t.editedAt=new Date().toISOString();t.editNote=`${yen(oldTotal)} → ${yen(t.total)}`;
  x.editTxId=null;save();render();toast("会計を更新しました");
}

function slots(x,d){
  const [a,b]=x.open.split(":").map(Number),[c,f]=x.close.split(":").map(Number);
  const start=a*60+b,end=c*60+f,step=(x.slot||1)*60,ts=transactions(x,d);let out="";
  for(let m=start;m<end;m+=step){
    const z=Math.min(m+step,end),arr=ts.filter(t=>{
      const q=new Date(t.timestamp),v=q.getHours()*60+q.getMinutes();
      return v>=m&&v<z;
    }),s=arr.reduce((a,t)=>a+t.total,0),q=arr.reduce((a,t)=>a+t.items.reduce((b,i)=>b+i.qty,0),0);
    out+=`<div class="slot"><span>${fmt(m)} ～ ${fmt(z)}</span><b>${q}個 / ${yen(s)}</b></div>`;
  }
  return out;
}
function fmt(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}

function saveAllStock(){
  const x=e();if(!x)return;
  if(x.eventClosed)return alert("締め済みイベントは在庫を変更できません。");
  const d=selectedDay(x);
  if(x.closed?.[d])return alert(`${d}は締め済みのため搬入できません。`);
  x.stock=x.stock||[];x.stockMoves=x.stockMoves||[];x.addByDay=x.addByDay||{};x.addByDay[d]=x.addByDay[d]||{};
  const m=stockMap(x),changes=[];
  for(const p of db.products){
    const old=m[p.id]||{in:0,add:0,show:0,store:0};
    const ni=num(document.getElementById("in_"+p.id)?.value);
    const na=num(document.getElementById("add_"+p.id)?.value);
    const di=ni-old.in;
    // 追加搬入は「今回の追加分」。過去日の追加搬入累計を上書きしない。
    if(di<0 && old.show<(-di))return alert(`${p.name}の初回搬入数を減らせません。現在のショーケース在庫が不足します。`);
    changes.push({p,ni,na,di});
  }
  const changed=changes.some(c=>c.di!==0||c.na>0);
  if(!changed)return toast("搬入数に変更はありません");
  pushUndo(x,"搬入数を変更");
  for(const c of changes){
    const s=ensureStock(x,c.p.id);
    if(c.di!==0)s.show+=c.di;
    if(c.na>0){
      s.store+=c.na;
      s.add=num(s.add)+c.na;
      x.addByDay[d][c.p.id]=num(x.addByDay[d][c.p.id])+c.na;
      x.stockMoves.push({id:Date.now()+Math.random(),productId:c.p.id,qty:c.na,type:"additional_delivery",day:d,timestamp:new Date().toISOString()});
    }
    s.in=c.ni;
  }
  save();render();toast(`${d}の追加搬入を保存しました`);
}

function eventMetrics(x){
  const days=dayList(x).map(d=>dayData(x,d));
  const total=days.reduce((a,d)=>a+num(d.sales),0);
  const fee=x.feeMode==="daily"?days.reduce((a,d)=>a+num(d.fee),0):Number(x.feeTotal||0);
  const groups=days.reduce((a,d)=>a+num(d.groups),0),allq=days.reduce((a,d)=>a+num(d.qty),0);
  const pay={};db.payments.forEach(p=>pay[p]=0);days.forEach(d=>Object.entries(d.pm||{}).forEach(([k,v])=>pay[k]=(pay[k]||0)+num(v)));
  const prodMap={};db.products.forEach(p=>prodMap[p.id]={id:p.id,name:p.name,qty:0,sales:0});
  days.forEach(d=>(d.products||[]).forEach(v=>{if(!prodMap[v.id])prodMap[v.id]={id:v.id,name:v.name||v.id,qty:0,sales:0};prodMap[v.id].qty+=num(v.qty);prodMap[v.id].sales+=num(v.sales);}));
  const prod=Object.values(prodMap).sort((a,b)=>b.qty-a.qty);
  const slotData={};days.forEach(d=>Object.entries(d.slotData||{}).forEach(([k,v])=>{slotData[k]??={qty:0,sales:0,groups:0};slotData[k].qty+=num(v.qty);slotData[k].sales+=num(v.sales);slotData[k].groups+=num(v.groups);}));
  return {total,fee,profit:total-fee,groups,allq,avg:groups?total/groups:0,pay,prod,days,slotData};
}

function eventNameForYearCompare(name){
  // 「駅マルシェ2026」と「駅マルシェ2027」のように、年だけ違う同名イベントを比較する。
  return String(name||'').replace(/20\d{2}/g,'').replace(/19\d{2}/g,'').replace(/[\s　]+/g,'').trim();
}
function findPreviousYearEvent(x){
  const y=Number(String(x.start||'').slice(0,4));
  if(!y)return null;
  const targetYear=String(y-1);
  const key=eventNameForYearCompare(x.name);
  const arr=(db.events||[]).filter(q=>{
    if(q.id===x.id)return false;
    if(String(q.start||'').slice(0,4)!==targetYear)return false;
    if(q.eventClosed===false)return false;
    return eventNameForYearCompare(q.name)===key;
  }).sort((a,b)=>String(b.end||b.start||'').localeCompare(String(a.end||a.start||'')));
  return arr[0]||null;
}
function signedDiff(a,b){
  const d=Number(a||0)-Number(b||0);
  return d>0?`+${d}`:`${d}`;
}

}
function newEvent(){
  db.events.unshift({id:"e"+Date.now(),name:"新しいイベント",start:jpToday(),end:jpToday(),open:"10:00",close:"17:00",slot:1,
    feeMode:"daily",feeTotal:0,fees:{},stock:[],stockMoves:[],undoStack:[],transactions:[],prices:Object.fromEntries(db.products.map(p=>[p.id,p.price])),closed:{},staffByDay:{},dayNotes:{},dayArchives:{},manualDays:{},takeBackByDay:{},wasteByDay:{},resetUndoStack:[],eventClosed:false,closedAt:null,cart:[]});
  location.hash=db.events[0].id;db.tab="settings";save();render();
}
function saveEvent(){
  let x=e();if(!x){newEvent();return}
  if(x.eventClosed)return alert("締め済みイベントは設定を変更できません。新しいイベントを作成してください。");
  const st=document.getElementById("start").value,en=document.getElementById("end").value;
  if(!st||!en||en<st)return alert("開催期間を正しく入力してください");
  const op=document.getElementById("open").value,cl=document.getElementById("close").value;
  if(!op||!cl||op>=cl)return alert("販売開始・終了時刻を正しく入力してください（終了は開始より後）");
  Object.assign(x,{name:document.getElementById("ename").value,start:st,end:en,open:op,
    close:cl,slot:Number(document.getElementById("slot").value),
    feeMode:document.getElementById("feeMode").value,feeTotal:Number(document.getElementById("feeTotal").value)||0});
  x.prices=x.prices||{};db.products.forEach(p=>x.prices[p.id]=x.prices[p.id]??p.price);
  save();db.tab="sale";render();
}
function closeEvent(){
  const x=e();if(!x)return;
  if(x.eventClosed)return alert("このイベントはすでに締め済みです。");
  if(x.cart?.length)return alert("未確定のカートがあります。先にカートを取り消すか会計を確定してください。");
  const openDays=dayList(x).filter(d=>!x.closed?.[d]);
  const future=x.end>=jpToday();
  let msg=`${x.name}をイベント終了として締めます。\n\n締め後は販売・在庫・スタッフ・経費・イベント価格の変更ができなくなります。\n未締めの日：${openDays.length?openDays.join('、'):'なし'}\n\nこのイベントを確定しますか？`;
  if(future)msg+=`\n\n⚠ 開催期間の終了日（${x.end}）より前です。予定より早く終了する場合のみ実行してください。`;
  if(!confirm(msg))return;
  pushUndo(x,"イベントを締める");
  const now=new Date().toISOString();
  x.closed=x.closed||{};dayList(x).forEach(d=>{if(!x.closed[d])x.closed[d]=now;if(!x.manualDays?.[d]&&!x.dayArchives?.[d])archiveDay(x,d);});
  x.eventClosed=true;x.closedAt=now;
  save();render();toast("イベントを締めました。次のイベントを作成できます");
}
function delEvent(){let x=e();if(!x)return;if(x.eventClosed&&!confirm("締め済みイベントです。履歴も含めて完全に削除します。バックアップ済みですか？"))return;if(confirm("このイベントの全データを削除しますか？\n会計・在庫・日報・締め済み履歴もすべて削除されます。")){db.events=db.events.filter(q=>q.id!==x.id);location.hash="";db.tab="events";save();render()}}
function savePrices(){let x=e();if(!x)return;if(x.eventClosed)return alert("締め済みイベントの価格は変更できません。");x.prices=x.prices||{};db.products.forEach(p=>x.prices[p.id]=Math.max(0,Number(document.getElementById("ep_"+p.id).value)||0));save();render()}
function saveProduct(id){
  let p=db.products.find(q=>q.id===id);if(!p)return;
  const name=(document.getElementById("n_"+id)?.value||"").trim(),price=Number(document.getElementById("p_"+id)?.value);
  if(!name)return alert("商品名を入力してください。");
  if(!Number.isFinite(price)||price<0)return alert("価格は0円以上で入力してください。");
  if(db.products.some(q=>q.id!==id&&String(q.name).trim()===name))return alert("同じ商品名がすでにあります。");
  p.name=name;p.price=Math.floor(price);save();render();
}
function addProduct(){db.products.push({id:"p"+Date.now(),name:"新商品",price:400});save();render()}
function saveStaff(i){const v=(document.getElementById("s_"+i)?.value||"").trim();if(!v)return alert("スタッフ名を入力してください。");if(db.staff.some((s,j)=>j!==i&&String(s).trim()===v))return alert("同じスタッフ名がすでにあります。");db.staff[i]=v;save();render()}
function removeStaff(i){if(db.staff.length<=1)return alert("スタッフは最低1名残してください。");if(!confirm(`${db.staff[i]}をスタッフマスターから削除しますか？\n過去日の記録は残ります。`))return;db.staff.splice(i,1);save();render()}
function addStaff(){db.staff.push("新スタッフ");save();render()}
function savePay(i){const v=(document.getElementById("m_"+i)?.value||"").trim();if(!v)return alert("支払方法を入力してください。");if(db.payments.some((s,j)=>j!==i&&String(s).trim()===v))return alert("同じ支払方法がすでにあります。");db.payments[i]=v;save();render()}
function removePay(i){if(db.payments.length<=1)return alert("支払方法は最低1つ残してください。");if(!confirm(`${db.payments[i]}を削除しますか？\n過去の会計記録は残ります。`))return;db.payments.splice(i,1);save();render()}
function addPay(){db.payments.push("新しい支払方法");save();render()}
function defaultDb(){
  return {events:[],products:base.map(x=>({id:x[0],name:x[1],price:x[2]})),staff:["スタッフ1","スタッフ2"],payments:["現金","PayPay"],tab:"events"};
}
function resetSnapshotLabel(x){
  if(!x)return "現在のイベント";
  return `${x.name||"現在のイベント"}（${x.start||""} ～ ${x.end||""}）`;
}
function openResetPanel(){
  const box=document.getElementById("resetPanel");if(!box)return;const x=e(),d=x?selectedDay(x):"";
  box.innerHTML=`<div class="card" style="box-shadow:none;border:1px solid #fecaca;margin:9px 0 0"><h3 style="margin-top:0">安全な初期化</h3>
  <div class="notice"><b>重要：</b>締め済みの日のデータは初期化対象になりません。閉じた日・過去イベントを保護したまま、未締め日のみを初期化します。</div>
  ${x?`<label>対象日</label><select id="resetDay">${dayList(x).filter(z=>!x.closed?.[z]).map(z=>`<option ${z===d?'selected':''}>${z}</option>`).join('')}</select>
  <label style="display:flex;align-items:center;gap:8px;font-weight:500"><input id="resetCurrentEventData" type="checkbox" style="width:auto"> この日の会計履歴・組数・日報・経費・未確定カートを初期化</label>
  <label style="display:flex;align-items:center;gap:8px;font-weight:500"><input id="resetCurrentStock" type="checkbox" style="width:auto"> この日の追加搬入入力だけをリセット（前日からの在庫は残す）</label>
  <label style="display:flex;align-items:center;gap:8px;font-weight:500"><input id="resetCurrentStaff" type="checkbox" style="width:auto"> この日のスタッフ登録を解除</label>
  <p class="muted">「前日の在庫まで戻す」場合は、現在の在庫を消さず、前日の締め済み在庫を基準に未締め日の追加分・販売分を戻します。</p>
  <button class="soft" onclick="resetToPreviousInventory()">↩ 前日の締め在庫まで戻す</button>
  <div class="row" style="margin-top:9px"><button class="bad" style="flex:1" onclick="executeReset()">選択した範囲だけ初期化</button><button class="soft" onclick="document.getElementById('resetPanel').innerHTML=''">閉じる</button></div>`:`<p class="muted">イベントを開いてから初期化してください。</p>`}
  ${x&&x.resetUndoStack?.length?`<button class="primary" style="margin-top:8px" onclick="undoReset()">↩ 初期化を取り消す（残り${x.resetUndoStack.length}件）</button>`:''}</div>`;
}
function previousClosedDay(x,d){const days=dayList(x),i=days.indexOf(d);for(let k=i-1;k>=0;k--)if(x.closed?.[days[k]])return days[k];return null;}
function resetToPreviousInventory(){
  const x=e(),d=document.getElementById('resetDay')?.value;if(!x||!d)return;const prev=previousClosedDay(x,d);if(!prev)return alert('直前の締め済み日の在庫記録がありません。');const ar=x.dayArchives?.[prev];if(!ar?.inventory)return alert('直前日の締め在庫が保存されていません。');
  if(!confirm(`${d}の会場在庫を${prev}の締め在庫まで戻します。\n\n未締め日の販売・追加搬入・持ち帰り・廃棄による差分を戻します。\n締め済み日のデータは変更しません。\n\n実行しますか？`))return;
  pushResetUndo(x,`${d}の在庫を前日締め在庫へ戻す`);
  x.stock=(x.stock||[]).map(s=>{const a=ar.inventory[s.productId];return a?{...s,show:num(a.show),store:num(a.store),in:num(a.in),add:num(a.add)}:s;});
  x.stockMoves=(x.stockMoves||[]).filter(m=>m.day!==d);x.addByDay[d]={};delete x.takeBackByDay[d];delete x.wasteByDay[d];
  save();render();toast(`${d}の在庫を${prev}締め時点へ戻しました`);
}
function executeReset(){
  const x=e(),d=document.getElementById('resetDay')?.value;if(!x||!d)return alert('イベントと対象日を確認してください。');
  if(x.closed?.[d])return alert(`${d}は締め済みのため初期化できません。`);
  const data=document.getElementById('resetCurrentEventData')?.checked,stock=document.getElementById('resetCurrentStock')?.checked,staff=document.getElementById('resetCurrentStaff')?.checked;
  if(!data&&!stock&&!staff)return alert('初期化する項目を選択してください。');
  if(!confirm(`${d}の未締めデータだけを初期化します。\n\n${data?'・会計履歴・組数・日報・経費・カート\n':''}${stock?'・この日の追加搬入入力\n':''}${staff?'・この日のスタッフ\n':''}\n締め済みの日・過去イベントは削除されません。\n\n実行しますか？`))return;
  pushResetUndo(x,`${d}の安全な初期化`);
  if(data){
    const todays=(x.transactions||[]).filter(t=>t.day===d&&t.status!=="void");
    todays.forEach(t=>returnToShowcase(x,t.items||[]));
    x.transactions=(x.transactions||[]).filter(t=>t.day!==d);x.cart=[];x.fees=x.fees||{};delete x.fees[d];x.dayNotes=x.dayNotes||{};delete x.dayNotes[d];
  }
  if(stock){x.addByDay=x.addByDay||{};delete x.addByDay[d];x.stockMoves=(x.stockMoves||[]).filter(m=>m.day!==d||m.type!=='additional_delivery');delete x.takeBackByDay?.[d];delete x.wasteByDay?.[d];}
  if(staff){x.staffByDay=x.staffByDay||{};delete x.staffByDay[d];}
  save();render();toast(`${d}の未締めデータを初期化しました`);
}

function resetAll(){openResetPanel();}
function backup(){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
  a.download="tart-event-backup-"+jpToday()+".json";a.click();
}
function restore(i){
  const f=i.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{
      const v=JSON.parse(r.result);
      if(!v||typeof v!=="object"||!Array.isArray(v.events)||!Array.isArray(v.products))throw new Error("形式不正");
      if(!confirm("バックアップの内容で現在のデータを上書きします。\n\n現在のデータは失われます。先に現在のバックアップを保存しましたか？"))return;
      db=v;normalizeDb();save();render();alert("復元しました")
    }catch(_){alert("読み込めないバックアップです。タルト販売管理から保存したJSONを選択してください。")}
  };r.readAsText(f);
}
function diagnoseData(){
  const issues=[],warnings=[];
  if(!db||!Array.isArray(db.events))issues.push("イベントデータが壊れています。");
  const ids=new Set();
  (db.products||[]).forEach(p=>{
    if(!p.id)issues.push("商品にIDがありません。");
    if(ids.has(p.id))issues.push(`商品IDが重複しています：${p.id}`);
    ids.add(p.id);
    if(!String(p.name||"").trim())warnings.push(`商品名が空です：${p.id}`);
  });
  let txCount=0;
  (db.events||[]).forEach(ev=>{
    const m=stockMap(ev);
    Object.entries(m).forEach(([pid,v])=>{
      if(v.show<0||v.store<0)issues.push(`${ev.name||"イベント"}：在庫がマイナス（${pid}）`);
      const expected=v.in+v.add-v.sold;
      if(expected!==v.remaining)issues.push(`${ev.name||"イベント"}：在庫計算不一致（${pid}：搬入${v.in+v.add}－販売${v.sold}≠残${v.remaining}）`);
    });
    (ev.transactions||[]).forEach(t=>{
      if(t.status!=="void"){
        txCount++;
        const calc=(t.items||[]).reduce((a,i)=>a+num(i.qty)*Number(i.price||0),0);
        if(Math.round(calc)!==Math.round(Number(t.total||0)))issues.push(`${ev.name||"イベント"}：会計${t.groupNo||"?"}の合計金額が明細と不一致`);
        if(!t.day)warnings.push(`${ev.name||"イベント"}：会計${t.groupNo||"?"}の日付がありません`);
      }
    });
    const days=dayList(ev);
    Object.keys(ev.closed||{}).forEach(d=>{if(!days.includes(d))warnings.push(`${ev.name||"イベント"}：対象外の日付が締めデータにあります（${d}）`)});
  });
  const msg=`データ診断結果\n\n会計件数：${txCount}件\n異常：${issues.length}件\n注意：${warnings.length}件\n\n${issues.length?"【異常】\n・"+issues.join("\n・")+"\n\n":""}${warnings.length?"【注意】\n・"+warnings.join("\n・")+"\n\n":""}${!issues.length&&!warnings.length?"問題は見つかりませんでした。":""}`;
  alert(msg);
}

}
