<body>
<header><h1>峠のチーズタルト｜イベント販売管理</h1><div class="sub" id="head"></div></header>
<div id="cloudbar" class="cloudbar">☁ クラウド同期を準備しています…</div><nav id="nav"></nav><main id="app"></main><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
/*
  タルト販売管理 v3
  - Firebaseの既存保存先・既存KEYを維持
  - iPhone/PC/Androidの同期方式を変更しない
  - 在庫の物理フローを明確化
    初回搬入 → ショーケース
    追加搬入 → ストッカー
    ストッカー → ショーケース（明示的に移動）
    販売 → ショーケースから減少
  - 総在庫 = ショーケース + ストッカー
  - 総在庫 = 初回搬入 + 追加搬入 - 販売数
*/

const KEY="toge_tart_manager_final_v2";
const base=[
  ["plain","プレーン",400],["double","Wチーズ",400],["choco","チョコレート",400],
  ["has","ハスカップ",400],["sea","シーベリー",400],["blue","ブルーベリー",400],
  ["white","白いガトーショコラ",450]
];

let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
  events:[],
  products:base.map(x=>({id:x[0],name:x[1],price:x[2]})),
  staff:["スタッフ1","スタッフ2"],
  payments:["現金","PayPay"],
  tab:"events"
};

function normalizeDb(){
  if(!db || typeof db!=="object") db={};
  db.events=Array.isArray(db.events)?db.events:[];
  db.products=Array.isArray(db.products)&&db.products.length?db.products:base.map(x=>({id:x[0],name:x[1],price:x[2]}));
  db.staff=Array.isArray(db.staff)?db.staff:["スタッフ1","スタッフ2"];
  db.payments=Array.isArray(db.payments)&&db.payments.length?db.payments:["現金","PayPay"];
  db.tab=db.tab||"events";
  db.events.forEach(ev=>{
    if(!ev || typeof ev!=="object") return;
    ev.transactions=Array.isArray(ev.transactions)?ev.transactions:[];
    ev.cart=Array.isArray(ev.cart)?ev.cart:[];
    ev.stock=Array.isArray(ev.stock)?ev.stock:[];
    ev.stockMoves=Array.isArray(ev.stockMoves)?ev.stockMoves:[];
    ev.undoStack=Array.isArray(ev.undoStack)?ev.undoStack:[];
    ev.prices=ev.prices&&typeof ev.prices==="object"?ev.prices:{};
    ev.closed=ev.closed&&typeof ev.closed==="object"?ev.closed:{};
    ev.fees=ev.fees&&typeof ev.fees==="object"?ev.fees:{};
  });
}
normalizeDb();

let cloudUser=null, cloudReady=false, cloudRef=null, cloudApplying=false;
const localSave=()=>localStorage.setItem(KEY,JSON.stringify(db));
const save=()=>{
  localSave();
  if(cloudReady&&cloudRef&&!cloudApplying){
    clearTimeout(window.__cloudSaveTimer);
    window.__cloudSaveTimer=setTimeout(
      ()=>cloudRef.set(db).catch(err=>setCloudStatus("⚠ 同期エラー："+(err?.message||err),"clouderr")),120
    );
  }
};
function setCloudStatus(msg,cls=""){
  const el=document.getElementById("cloudbar");
  if(el) el.innerHTML=`<b class="${cls}">${msg}</b>`;
}
function cloudLoginView(){
  return `<div class="card loginbox"><h2>☁ 会計データをクラウド同期</h2>
  <p class="muted">PC・iPhone・Androidで同じ会計データを使うには、同じメールアドレスでログインしてください。</p>
  <label>メールアドレス</label><input id="cloudEmail" type="email" autocomplete="username" placeholder="例：xxxx@example.com">
  <label>パスワード</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="6文字以上">
  <div class="row" style="margin-top:10px"><button class="primary" style="flex:1" onclick="cloudSignIn()">ログイン</button>
  <button class="soft" style="flex:1" onclick="cloudSignUp()">新規登録</button></div>
  <p class="muted" style="margin-bottom:0">※このアプリ用のアカウントです。Google等の外部サービスのパスワードを入力する必要はありません。</p></div>`;
}
function cloudSetupView(){
  return `<div class="card loginbox"><h2>☁ クラウド設定が未完了です</h2>
  <p>Firebaseの設定がまだ入っていません。</p>
  <div class="notice">この段階では現在の端末のデータは消えません。</div></div>`;
}
async function cloudSignIn(){
  const email=document.getElementById("cloudEmail")?.value.trim(),pw=document.getElementById("cloudPassword")?.value||"";
  if(!email||!pw)return alert("メールアドレスとパスワードを入力してください。");
  try{await firebase.auth().signInWithEmailAndPassword(email,pw)}
  catch(err){alert("ログインできませんでした。\n"+(err?.message||err))}
}
async function cloudSignUp(){
  const email=document.getElementById("cloudEmail")?.value.trim(),pw=document.getElementById("cloudPassword")?.value||"";
  if(!email||!pw)return alert("メールアドレスとパスワードを入力してください。");
  if(pw.length<6)return alert("パスワードは6文字以上にしてください。");
  try{await firebase.auth().createUserWithEmailAndPassword(email,pw);alert("アカウントを作成しました。")}
  catch(err){alert("新規登録できませんでした。\n"+(err?.message||err))}
}
async function cloudLogout(){await firebase.auth().signOut()}

function cloudInit(){
  const cfg=window.TART_FIREBASE_CONFIG||{};
  if(!cfg.apiKey||!cfg.projectId||!cfg.databaseURL){
    setCloudStatus("⚠ クラウド設定待ち","cloudwarn");
    document.getElementById("app").innerHTML=cloudSetupView(); return;
  }
  try{
    firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(user=>{
      cloudUser=user||null; cloudReady=false; cloudRef=null;
      if(!user){
        setCloudStatus("☁ 未ログイン");
        document.getElementById("app").innerHTML=cloudLoginView(); return;
      }
      cloudRef=firebase.database().ref("users/"+user.uid+"/app");
      setCloudStatus("☁ クラウド同期中…");
      cloudRef.once("value").then(snap=>{
        const remote=snap.val();
        if(remote){
          db={
            ...db,...remote,
            events:Array.isArray(remote.events)?remote.events:db.events,
            products:Array.isArray(remote.products)?remote.products:db.products,
            staff:Array.isArray(remote.staff)?remote.staff:db.staff,
            payments:Array.isArray(remote.payments)?remote.payments:db.payments
          };
          normalizeDb();
        }
        localSave();
        cloudReady=true;
        setCloudStatus("☁ 同期中："+user.email,"cloudok");
        render();
        if(!remote) cloudRef.set(db).catch(err=>setCloudStatus("⚠ 初回保存エラー："+(err?.message||err),"clouderr"));
        cloudRef.on("value",snap2=>{
          if(!cloudReady||cloudApplying)return;
          const v=snap2.val(); if(!v)return;
          cloudApplying=true;
          db=v; normalizeDb(); localSave(); render();
          cloudApplying=false;
          setCloudStatus("☁ 同期中："+user.email,"cloudok");
        });
      }).catch(err=>{
        setCloudStatus("⚠ クラウド接続エラー："+(err?.message||err),"clouderr");
        document.getElementById("app").innerHTML=cloudLoginView();
      });
    });
  }catch(err){
    setCloudStatus("⚠ Firebase初期化エラー："+(err?.message||err),"clouderr");
    document.getElementById("app").innerHTML=cloudSetupView();
  }
}

const CLEAR_MARK="toge_tart_manager_clear_accounts_20260902";
const STOCK_V2_MARK="toge_tart_manager_stock_v2_20260907";
const V3_MARK="toge_tart_manager_stock_v3_20260912";

/* 旧v2の在庫を壊さず、現在の「初回+追加-販売」と一致する形へ一度だけ整える。
   既存のshow/storeの比率をできるだけ維持し、販売数だけを反映する。 */
function migrateStockV3(){
  if(localStorage.getItem(V3_MARK)) return;
  (db.events||[]).forEach(ev=>{
    ev.stock=ev.stock||[];
    ev.stockMoves=Array.isArray(ev.stockMoves)?ev.stockMoves:[];
    const soldBy={};
    (ev.transactions||[]).filter(t=>t.status!=="void").forEach(t=>{
      (t.items||[]).forEach(i=>soldBy[i.productId]=(soldBy[i.productId]||0)+Number(i.qty||0));
    });
    ev.stock.forEach(s=>{
      const total=Math.max(0,Number(s.in||0)+Number(s.add||0)-(soldBy[s.productId]||0));
      const oldShow=Math.max(0,Number(s.show||0));
      const oldStore=Math.max(0,Number(s.store||0));
      const oldTotal=oldShow+oldStore;
      if(oldTotal===total){
        s.show=oldShow; s.store=oldStore;
      }else{
        s.show=Math.min(total,Math.max(0,oldShow));
        s.store=total-s.show;
      }
    });
  });
  localSave();
  localStorage.setItem(V3_MARK,"1");
}
migrateStockV3();

/* 旧版で一度だけ会計データを初期化した仕組みはそのまま維持。
   すでに実行済み端末では何も起きない。 */
if(!localStorage.getItem(CLEAR_MARK)){
  (db.events||[]).forEach(ev=>{ev.transactions=[];ev.cart=[];ev.closed={};ev.editTxId=null;ev.fees={};});
  save(); localStorage.setItem(CLEAR_MARK,"1");
}

function toast(msg){
  const t=document.getElementById("toast"); if(!t)return;
  t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1400);
}
function flash(el,msg){
  if(el){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}
  if(msg)toast(msg);
}
const e=()=>db.events.find(x=>x.id===location.hash.slice(1))||db.events[0];
const yen=n=>"¥"+Math.round(n||0).toLocaleString();
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num=v=>Math.max(0,Math.floor(Number(v)||0));

/* 会計番号を維持 */
(db.events||[]).forEach(ev=>{
  ev.transactions=ev.transactions||[];
  let n=1;
  ev.transactions.slice().sort((a,b)=>(a.id||0)-(b.id||0)).forEach(t=>{
    if(!t.groupNo)t.groupNo=n;
    n=Math.max(n,(Number(t.groupNo)||0)+1);
  });
  ev.cart=ev.cart||[];
});

function jpToday(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function dayList(x){
  const a=[];
  // UTCベースで日付文字列を扱い、端末のタイムゾーンによる1日ズレを防止
  let d=new Date(x.start+"T00:00:00+09:00"), z=new Date(x.end+"T00:00:00+09:00");
  while(d<=z){
    a.push(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(d));
    d=new Date(d.getTime()+86400000);
  }
  return a;
}
function selectedDay(x){
  const t=jpToday(),days=dayList(x);
  return x.selectedDay&&days.includes(x.selectedDay)?x.selectedDay:(days.includes(t)?t:days[0]);
}
function transactions(x,day=null){return (x?.transactions||[]).filter(t=>t.status!=="void"&&(!day||t.day===day))}
function allTransactions(x,day=null){return (x?.transactions||[]).filter(t=>!day||t.day===day)}
function nextGroupNo(x){return Math.max(0,...(x.transactions||[]).map(t=>Number(t.groupNo)||0))+1}
function sales(x,day=null){return transactions(x,day).reduce((s,t)=>s+Number(t.total||0),0)}
function qty(x,pid,day=null){
  return transactions(x,day).reduce((s,t)=>s+(t.items||[]).filter(i=>i.productId===pid).reduce((a,i)=>a+num(i.qty),0),0);
}

/* 在庫の基本状態 */
function stockMap(x){
  const m={};
  db.products.forEach(p=>m[p.id]={in:0,add:0,show:0,store:0});
  (x?.stock||[]).forEach(s=>{
    if(m[s.productId]){
      m[s.productId].in=num(s.in);m[s.productId].add=num(s.add);
      m[s.productId].show=num(s.show);m[s.productId].store=num(s.store);
    }
  });
  db.products.forEach(p=>{
    const sold=qty(x,p.id);
    m[p.id].sold=sold;
    m[p.id].remaining=m[p.id].show+m[p.id].store;
    m[p.id].totalIn=m[p.id].in+m[p.id].add;
  });
  return m;
}
function ensureStock(x,pid){
  x.stock=x.stock||[];
  let s=x.stock.find(q=>q.productId===pid);
  if(!s){
    s={productId:pid,in:0,add:0,show:0,store:0};
    x.stock.push(s);
  }
  return s;
}
function stockTotals(x,pid){
  const s=stockMap(x)[pid]||{show:0,store:0,in:0,add:0};
  return {show:s.show,store:s.store,total:s.show+s.store};
}
function changeShow(x,pid,delta){
  const s=ensureStock(x,pid),n=num(s.show)+delta;
  if(n<0)return false;
  s.show=n;return true;
}

/* 販売時は必ずショーケースから減らす */
function consumeForSale(x,items){
  const m=stockMap(x);
  for(const i of items){
    if((m[i.productId]?.show||0)<num(i.qty)){
      const p=db.products.find(q=>q.id===i.productId);
      return {ok:false,name:p?.name||i.name,available:m[i.productId]?.show||0,need:num(i.qty)};
    }
  }
  for(const i of items)ensureStock(x,i.productId).show-=num(i.qty);
  return {ok:true};
}
function returnToShowcase(x,items){
  for(const i of items)ensureStock(x,i.productId).show+=num(i.qty);
}

/* 操作を1手順戻せるよう、イベント単位で直前状態を最大20件保存。
   Firebaseへ一緒に保存するため、PCとiPhoneの間でもUndo状態を共有する。 */
function pushUndo(x,label){
  x.undoStack=Array.isArray(x.undoStack)?x.undoStack:[];
  const snap={label,timestamp:new Date().toISOString(),stock:JSON.parse(JSON.stringify(x.stock||[])),stockMoves:JSON.parse(JSON.stringify(x.stockMoves||[])),transactions:JSON.parse(JSON.stringify(x.transactions||[])),cart:JSON.parse(JSON.stringify(x.cart||[])),fees:JSON.parse(JSON.stringify(x.fees||{})),closed:JSON.parse(JSON.stringify(x.closed||{}))};
  x.undoStack.push(snap);
  if(x.undoStack.length>20)x.undoStack.shift();
}
function undoLastStep(){
  const x=e(); if(!x)return;
  x.undoStack=Array.isArray(x.undoStack)?x.undoStack:[];
  const u=x.undoStack.pop();
  if(!u)return alert("戻せる操作がありません。");
  x.stock=JSON.parse(JSON.stringify(u.stock||[]));
  x.stockMoves=JSON.parse(JSON.stringify(u.stockMoves||[]));
  x.transactions=JSON.parse(JSON.stringify(u.transactions||[]));
  x.cart=JSON.parse(JSON.stringify(u.cart||[]));
  x.fees=JSON.parse(JSON.stringify(u.fees||{}));
  x.closed=JSON.parse(JSON.stringify(u.closed||{}));
  x.editTxId=null;
  save(); render(); toast("1手順前に戻しました："+(u.label||"直前の操作"));
}
function undoButton(){
  const x=e(),n=x?.undoStack?.length||0;
  return `<button class="warn" ${n?'':'disabled'} onclick="undoLastStep()">↩ 1手順前に戻す${n?`（残り${n}）`:''}</button>`;
}

/* 明示的なストッカー→ショーケース移動 */
function transferToShow(pid){
  const x=e(); if(!x)return;
  const s=ensureStock(x,pid),p=db.products.find(q=>q.id===pid);
  const max=s.store;
  if(max<1)return alert(`${p?.name||"商品"}のストッカー在庫がありません。`);
  const v=prompt(`${p?.name||"商品"}をストッカーからショーケースへ何個移動しますか？\n現在のストッカー：${max}個`,String(Math.min(10,max)));
  if(v===null)return;
  const n=num(v);
  if(n<1)return;
  if(n>max)return alert(`ストッカーには${max}個しかありません。`);
  pushUndo(x,`${p?.name||"商品"}をストッカーからショーケースへ${n}個移動`);
  s.store-=n;s.show+=n;
  x.stockMoves=x.stockMoves||[];

function openTx(id){let x=e();x.editTxId=id;save();render();setTimeout(()=>document.querySelector('.editor')?.scrollIntoView({behavior:'smooth',block:'center'}),50)}
function saveTx(id){
  const x=e(),t=x.transactions.find(q=>String(q.id)===String(id));if(!t)return;
  if(x.closed?.[t.day])return alert("締め済みの日は変更できません。");
  const oldItems=(t.items||[]).map(i=>({...i}));
  const items=[];
  db.products.forEach(p=>{
    const q=Math.max(0,Number(document.getElementById('txq_'+p.id)?.value)||0);
    if(q){
      const old=t.items.find(i=>i.productId===p.id);
      const price=old?.price??Number(x.prices?.[p.id]??p.price);
      items.push({productId:p.id,name:p.name,price,qty:q});
    }
  });
  if(!items.length)return alert("商品を1つ以上選択してください。");

  // 差分を計算し、増加分はショーケースから、減少分はショーケースへ戻す
  const oldBy={},newBy={};
  oldItems.forEach(i=>oldBy[i.productId]=(oldBy[i.productId]||0)+num(i.qty));
  items.forEach(i=>newBy[i.productId]=(newBy[i.productId]||0)+num(i.qty));
  const m=stockMap(x);
  for(const p of db.products){
    const diff=(newBy[p.id]||0)-(oldBy[p.id]||0);
    if(diff>0 && (m[p.id]?.show||0)<diff)return alert(`${p.name}のショーケース在庫が不足しています。`);
  }
  pushUndo(x,`${Number(t.groupNo)||'?'}組目の会計を編集`);
  for(const p of db.products){
    const diff=(newBy[p.id]||0)-(oldBy[p.id]||0);
    if(diff>0)ensureStock(x,p.id).show-=diff;
    if(diff<0)ensureStock(x,p.id).show+=(-diff);
  }
  const oldTotal=t.total;
  t.items=items;t.total=items.reduce((s,i)=>s+i.qty*i.price,0);
  t.payment=document.getElementById('txpay').value;
  t.editedAt=new Date().toISOString();t.editNote=`${yen(oldTotal)} → ${yen(t.total)}`;
  x.editTxId=null;save();render();toast("会計を更新しました");
}
function add(pid,btn){

  const price=Number(x.prices?.[pid]??p.price);

function chg(pid,n){
  const x=e(),i=x.cart.find(q=>q.productId===pid);if(!i)return;
  if(n>0){const sm=stockMap(x);if((sm[pid]?.show||0)<=i.qty)return alert("ショーケース在庫が不足しています。");}
  i.qty+=n;if(i.qty<1)x.cart=x.cart.filter(q=>q!==i);

function createTransaction(x,d,items,pay){

    items:items.map(i=>({...i})),total:items.reduce((s,i)=>s+i.qty*i.price,0),payment:pay,status:"completed"};

function quickSale(pid,pay,btn){

  pushUndo(x,`まとめ会計を${pay}で確定`);
  createTransaction(x,d,x.cart,pay);x.cart=[];save();flash(btn,`${pay}で会計を確定しました`);render();

function slots(x,d){
  const [a,b]=x.open.split(":").map(Number),[c,f]=x.close.split(":").map(Number);
  const start=a*60+b,end=c*60+f,step=(x.slot||1)*60,ts=transactions(x,d);let out="";
  for(let m=start;m<end;m+=step){
    const z=Math.min(m+step,end),arr=ts.filter(t=>{
      const q=new Date(t.timestamp),v=q.getHours()*60+q.getMinutes();
      return v>=m&&v<z;
    }),s=arr.reduce((a,t)=>a+t.total,0),q=arr.reduce((a,t)=>a+t.items.reduce((b,i)=>b+i.qty,0),0);
    out+=`<div class="slot"><span>${fmt(m)} ～ ${fmt(z)}</span><b>${q}個 / ${yen(s)}</b></div>`;
  }
  return out;
}
function fmt(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}

function saveAllStock(){
  const x=e();if(!x)return;
  x.stock=x.stock||[];x.stockMoves=x.stockMoves||[];
  const m=stockMap(x),newStock=[];
  pushUndo(x,"搬入数を変更");
  for(const p of db.products){
    const old=m[p.id]||{in:0,add:0,show:0,store:0};
    const ni=num(document.getElementById("in_"+p.id)?.value);
    const na=num(document.getElementById("add_"+p.id)?.value);
    const di=ni-old.in,da=na-old.add;
    let s=ensureStock(x,p.id);
    if(di>0)s.show+=di;
    if(di<0){
      const reduce=-di;
      if(s.show<reduce)return alert(`${p.name}の初回搬入数を減らせません。現在のショーケース在庫が不足します。`);
      s.show-=reduce;
    }
    if(da>0)s.store+=da;
    if(da<0){
      const reduce=-da;
      if(s.store<reduce)return alert(`${p.name}の追加搬入数を減らせません。現在のストッカー在庫が不足します。`);
      s.store-=reduce;
    }
    s.in=ni;s.add=na;
    newStock.push({productId:p.id,in:s.in,add:s.add,show:s.show,store:s.store});
  }
  x.stock=newStock;save();render();toast("全商品の搬入数を保存しました");
}

function summary(x){
  const fee=x.feeMode==="daily"?Object.values(x.fees||{}).reduce((a,b)=>a+b,0):Number(x.feeTotal||0),
  total=sales(x),allq=transactions(x).reduce((a,t)=>a+t.items.reduce((b,i)=>b+i.qty,0),0);
  return `<div class="card"><h2>イベント全体集計</h2><div class="grid"><div><div class="muted">総販売数</div><div class="big">${allq}個</div></div>
  <div><div class="muted">総売上</div><div class="big">${yen(total)}</div></div></div><p>手数料・経費：<b>${yen(fee)}</b>　利益：<b>${yen(total-fee)}</b></p>
  <h3>日別</h3><table><tr><th>日付</th><th>売上</th><th>締め</th></tr>${dayList(x).map(d=>`<tr><td>${d}</td><td>${yen(sales(x,d))}</td><td>${x.closed?.[d]?"済":"未"}</td></tr>`).join("")}</table>
  <h3>商品別</h3><table><tr><th>商品</th><th>数量</th><th>売上</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${qty(x,p.id)}</td><td>${yen(transactions(x).reduce((s,t)=>s+t.items.filter(i=>i.productId===p.id).reduce((a,i)=>a+i.qty*i.price,0),0))}</td></tr>`).join("")}</table>
  <button class="soft" onclick="printSummary()">🖨 イベント集計を印刷</button></div>`;
}
function settings(x){
  return `<div class="card"><h2>${x?"イベント設定":"新規イベント設定"}</h2><div class="grid">
  <div><label>イベント名</label><input id="ename" value="${esc(x?.name||"")}"></div>
  <div><label>時間帯集計</label><select id="slot"><option value="1" ${(x?.slot||1)==1?"selected":""}>1時間ごと</option><option value="2" ${(x?.slot||1)==2?"selected":""}>2時間ごと</option><option value="3" ${(x?.slot||1)==3?"selected":""}>3時間ごと</option></select></div>
  <div><label>開始日</label><input id="start" type="date" value="${x?.start||jpToday()}"></div><div><label>終了日</label><input id="end" type="date" value="${x?.end||jpToday()}"></div>
  <div><label>販売開始</label><input id="open" type="time" value="${x?.open||"10:00"}"></div><div><label>販売終了</label><input id="close" type="time" value="${x?.close||"17:00"}"></div>
  <div><label>経費入力</label><select id="feeMode"><option value="daily" ${x?.feeMode!=="total"?"selected":""}>日ごと</option><option value="total" ${x?.feeMode==="total"?"selected":""}>イベント合算</option></select></div>
  <div><label>合算額</label><input id="feeTotal" type="number" value="${x?.feeTotal||0}"></div></div>
  <button class="primary" style="margin-top:9px" onclick="saveEvent()">保存</button>${x?` <button class="bad" onclick="delEvent()">イベント削除</button>`:""}</div>
  ${x?`<div class="card"><h3>イベント価格</h3><p class="muted">変更後の会計から新価格。過去の会計価格は変わりません。</p>
  ${db.products.map(p=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(p.name)}</span><input id="ep_${p.id}" type="number" value="${x.prices?.[p.id]??p.price}"></div>`).join("")}
  <button class="soft" onclick="savePrices()">保存</button></div>`:""}
  <div class="card"><h3>商品マスター</h3>${db.products.map(p=>`<div class="row" style="margin:6px 0"><input id="n_${p.id}" value="${esc(p.name)}"><input id="p_${p.id}" type="number" value="${p.price}"><button class="soft" onclick="saveProduct('${p.id}')">保存</button></div>`).join("")}
  <button class="soft" onclick="addProduct()">＋商品追加</button></div>
  <div class="card"><h3>スタッフ</h3>${db.staff.map((s,i)=>`<div class="row" style="margin:6px 0"><input id="s_${i}" value="${esc(s)}"><button class="soft" onclick="saveStaff(${i})">保存</button><button class="bad" onclick="removeStaff(${i})">削除</button></div>`).join("")}
  <button class="soft" onclick="addStaff()">＋追加</button></div>
  <div class="card"><h3>支払方法</h3>${db.payments.map((s,i)=>`<div class="row" style="margin:6px 0"><input id="m_${i}" value="${esc(s)}"><button class="soft" onclick="savePay(${i})">保存</button><button class="bad" onclick="removePay(${i})">削除</button></div>`).join("")}
  <button class="soft" onclick="addPay()">＋追加</button></div>
  <div class="card"><h3>クラウド同期</h3><p class="muted">ログイン中：${esc(cloudUser?.email||"未ログイン")}</p>${cloudUser?`<button class="soft" onclick="cloudLogout()">ログアウト</button>`:`<p class="muted">ログインすると、この端末の会計データをPC・iPhone・Androidで共有できます。</p>`}</div>
  <div class="card"><h3>データ保護</h3><p class="muted">イベント終了後などにバックアップしてください。</p><button class="soft" onclick="backup()">バックアップ保存</button>
  <label>バックアップ復元</label><input type="file" accept=".json" onchange="restore(this)">
  <div class="dangerbox" style="margin-top:14px"><b>全データを初期化</b><p class="muted">イベント・会計履歴・在庫・設定をすべて削除して、アプリを最初の状態に戻します。</p><button class="bad" onclick="resetAll()">⚠ すべて初期化する</button></div></div>
  <div class="notice">iPhone運用：HTTPSで公開したページをSafariで開き、「共有 → ホーム画面に追加 → Webアプリとして開く」でホーム画面に追加します。</div>`;
}
function newEvent(){
  db.events.unshift({id:"e"+Date.now(),name:"新しいイベント",start:jpToday(),end:jpToday(),open:"10:00",close:"17:00",slot:1,
    feeMode:"daily",feeTotal:0,fees:{},stock:[],stockMoves:[],undoStack:[],transactions:[],prices:Object.fromEntries(db.products.map(p=>[p.id,p.price])),closed:{},cart:[]});
  location.hash=db.events[0].id;db.tab="settings";save();render();
}
function saveEvent(){
  let x=e();if(!x){newEvent();return}
  const st=document.getElementById("start").value,en=document.getElementById("end").value;
  if(!st||!en||en<st)return alert("開催期間を正しく入力してください");
  Object.assign(x,{name:document.getElementById("ename").value,start:st,end:en,open:document.getElementById("open").value,
    close:document.getElementById("close").value,slot:Number(document.getElementById("slot").value),
    feeMode:document.getElementById("feeMode").value,feeTotal:Number(document.getElementById("feeTotal").value)||0});
  x.prices=x.prices||{};db.products.forEach(p=>x.prices[p.id]=x.prices[p.id]??p.price);
  save();db.tab="sale";render();
}
function delEvent(){let x=e();if(confirm("このイベントの全データを削除しますか？")){db.events=db.events.filter(q=>q.id!==x.id);location.hash="";db.tab="events";save();render()}}
function savePrices(){let x=e();x.prices=x.prices||{};db.products.forEach(p=>x.prices[p.id]=Number(document.getElementById("ep_"+p.id).value)||0);save();render()}
function saveProduct(id){let p=db.products.find(q=>q.id===id);p.name=document.getElementById("n_"+id).value;p.price=Number(document.getElementById("p_"+id).value)||0;save();render()}
function addProduct(){db.products.push({id:"p"+Date.now(),name:"新商品",price:400});save();render()}
function saveStaff(i){db.staff[i]=document.getElementById("s_"+i).value;save();render()}
function removeStaff(i){db.staff.splice(i,1);save();render()}
function addStaff(){db.staff.push("新スタッフ");save();render()}
function savePay(i){db.payments[i]=document.getElementById("m_"+i).value;save();render()}
function removePay(i){if(db.payments.length>1)db.payments.splice(i,1);save();render()}
function addPay(){db.payments.push("新しい支払方法");save();render()}
function resetAll(){
  if(!confirm("本当にすべてのデータを初期化しますか？\nイベント、会計履歴、在庫、商品・スタッフ・支払方法の設定もすべて削除されます。\nこの操作は元に戻せません。"))return;
  if(!confirm("最終確認です。本当にリセットしますか？"))return;
  localStorage.removeItem(KEY);location.hash="";location.reload();
}
function backup(){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
  a.download="tart-event-backup-"+jpToday()+".json";a.click();
}
function restore(i){
  const f=i.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{db=JSON.parse(r.result);normalizeDb();save();render();alert("復元しました")}
    catch(_){alert("読み込めないバックアップです")}
  };r.readAsText(f);
}
function printDaily(d){
  const x=e(),pm=payTotals(x,d),fee=x.feeMode==="daily"?(x.fees?.[d]||0):0,app=document.getElementById("app"),old=app.innerHTML;
  app.innerHTML=`<div class="printarea"><h1>部門別売上日報（スイーツ工房イベント用）</h1><h2>${esc(x.name)}</h2>
  <p>${d}　${x.open}～${x.close}</p><h2>売上：${yen(sales(x,d))}</h2>
  ${Object.entries(pm).map(([p,v])=>`<p>${esc(p)}：${yen(v)}</p>`).join("")}<h3>商品別</h3>
  ${db.products.map(p=>`<p>${esc(p.name)}：${qty(x,p.id,d)}個</p>`).join("")}<h3>時間帯別</h3>${slots(x,d)}
  <h3>手数料・経費：${yen(fee)}</h3><h2>利益：${yen(sales(x,d)-fee)}</h2></div>`;
  window.print();app.innerHTML=old;
}
function printSummary(){
  const x=e(),app=document.getElementById("app"),old=app.innerHTML,fee=x.feeMode==="daily"?Object.values(x.fees||{}).reduce((a,b)=>a+b,0):x.feeTotal;
  app.innerHTML=`<div class="printarea"><h1>${esc(x.name)} イベント集計</h1><p>${x.start} ～ ${x.end}</p>
  <h2>総売上：${yen(sales(x))}</h2><h2>手数料・経費：${yen(fee)}</h2><h2>利益：${yen(sales(x)-fee)}</h2>
  ${dayList(x).map(d=>`<p>${d}　売上 ${yen(sales(x,d))}</p>`).join("")}</div>`;
  window.print();app.innerHTML=old;
}

if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
cloudInit();
</script></script></body></html>
